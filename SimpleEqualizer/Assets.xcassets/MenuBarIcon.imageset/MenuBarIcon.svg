<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
  <g id="slider-left">
    <line id="track" x1="4" y1="2.5" x2="4" y2="15.5" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
    <line id="level" x1="4" y1="9" x2="4" y2="15.5" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <circle id="knob" cx="4" cy="9" r="2.5" fill="#000000"/>
  </g>

  <g id="slider-center">
    <line id="track" x1="9" y1="2.5" x2="9" y2="15.5" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
    <line id="level" x1="9" y1="5.5" x2="9" y2="15.5" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <circle id="knob" cx="9" cy="5.5" r="2.5" fill="#000000"/>
  </g>

  <g id="slider-right">
    <line id="track" x1="14" y1="2.5" x2="14" y2="15.5" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
    <line id="level" x1="14" y1="12.5" x2="14" y2="15.5" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
    <circle id="knob" cx="14" cy="12.5" r="2.5" fill="#000000"/>
  </g>
</svg>
