# ホームページ(site/)を GitHub Pages に公開する。
# README の画像(assets/)と合わせて tools/build-site.sh でまとめてから公開する。
# リポジトリの Settings → Pages で、Source を「GitHub Actions」にしてから動く。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "tools/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: tools/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
